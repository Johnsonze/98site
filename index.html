<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="座位选座系统 - 多人在线实时选座">
    <title>座位选座系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: #1a1a2e;
            color: white;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
        }

        .header h1 {
            font-size: 28px;
            background: linear-gradient(135deg, #00ff88, #00cc6a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .online-count {
            color: #8b8b8b;
            font-size: 14px;
        }

        .admin-toggle {
            padding: 10px 20px;
            border: 2px solid #3d3d5c;
            background: transparent;
            color: #8b8b8b;
            border-radius: 25px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .admin-toggle:hover {
            border-color: #ff6b6b;
            color: #ff6b6b;
        }

        .admin-toggle.active {
            border-color: #00ff88;
            background: rgba(0, 255, 136, 0.1);
            color: #00ff88;
        }

        .connection-status {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: rgba(45, 45, 68, 0.8);
            border-radius: 20px;
            font-size: 14px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }

        .status-dot.online {
            background: #00ff88;
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
        }

        .status-dot.offline {
            background: #ff6b6b;
        }

        .date-tabs {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            overflow-x: auto;
            padding: 10px 0;
        }

        .date-tab {
            flex-shrink: 0;
            padding: 12px 24px;
            background: rgba(45, 45, 68, 0.8);
            border-radius: 30px;
            font-size: 14px;
            color: #8b8b8b;
            cursor: pointer;
            transition: all 0.3s;
            border: 2px solid transparent;
            user-select: none;
        }

        .date-tab:hover {
            background: rgba(60, 60, 88, 0.9);
            color: white;
        }

        .date-tab.active {
            background: linear-gradient(135deg, #00ff88, #00cc6a);
            color: #1a1a2e;
            font-weight: bold;
            border-color: #00ff88;
        }

        .seat-map {
            position: relative;
            background: rgba(30, 30, 50, 0.5);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
        }

        .exit {
            position: absolute;
            color: white;
            font-size: 14px;
            font-weight: bold;
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
        }

        .exit-left { left: 20px; top: 20px; }
        .exit-right { right: 20px; top: 20px; }

        .dj-stage {
            background: linear-gradient(135deg, #ff6b6b, #cc4757);
            color: white;
            padding: 20px 40px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            margin: 0 auto 40px;
            display: inline-block;
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.3);
            position: relative;
            left: 50%;
            transform: translateX(-50%);
        }

        .main-layout {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 50px;
            margin-bottom: 30px;
        }

        .side-column {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .side-column.left {
            border-right: 2px dashed rgba(255, 255, 255, 0.1);
            padding-right: 40px;
        }

        .side-column.right {
            border-left: 2px dashed rgba(255, 255, 255, 0.1);
            padding-left: 40px;
        }

        .center-area {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .seat-row {
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .seat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 60px;
            margin: 4px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .seat-item:hover {
            transform: scale(1.05);
        }

        .seat {
            width: 50px;
            height: 50px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 14px;
            font-weight: bold;
            border: 2px solid transparent;
            transition: all 0.3s ease;
        }

        .seat.available {
            background: linear-gradient(145deg, #ff6b6b, #ee5a5a);
            border-color: #ff4757;
        }

        .seat.available:hover {
            box-shadow: 0 0 15px rgba(255, 107, 107, 0.5);
        }

        .seat.locked {
            background: linear-gradient(145deg, #f39c12, #e67e22);
            border-color: #f39c12;
            animation: pulse 1s infinite;
        }

        .seat.selected {
            background: linear-gradient(145deg, #00ff88, #00cc6a);
            border-color: #00ff88;
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.5);
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 10px rgba(243, 156, 18, 0.5); }
            50% { box-shadow: 0 0 20px rgba(243, 156, 18, 0.8); }
        }

        .seat-name {
            font-size: 11px;
            color: #8b8b8b;
            margin-top: 4px;
            max-width: 55px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            text-align: center;
        }

        .satg {
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #8b8b8b;
            font-size: 12px;
            font-weight: bold;
            background: rgba(45, 45, 68, 0.8);
            border-radius: 8px;
            margin: 0 10px;
        }

        .bottom-section {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            padding: 20px;
            border-top: 2px solid rgba(255, 255, 255, 0.1);
        }

        .bar-section, .front-label {
            color: white;
            font-size: 16px;
            font-weight: bold;
            padding: 12px 24px;
            background: rgba(255, 107, 107, 0.2);
            border-radius: 8px;
            border: 1px solid rgba(255, 107, 107, 0.3);
        }

        .front-seats {
            display: flex;
            gap: 10px;
        }

        .legend {
            display: flex;
            justify-content: center;
            gap: 30px;
            padding: 20px;
            background: rgba(45, 45, 68, 0.8);
            border-radius: 12px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #8b8b8b;
            font-size: 14px;
        }

        .legend-color {
            width: 30px;
            height: 30px;
            border-radius: 6px;
        }

        .legend-color.available { background: linear-gradient(145deg, #ff6b6b, #ee5a5a); }
        .legend-color.locked { background: linear-gradient(145deg, #f39c12, #e67e22); }
        .legend-color.selected { background: linear-gradient(145deg, #00ff88, #00cc6a); }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-content {
            width: 100%;
            max-width: 400px;
            background: #2d2d44;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 24px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .modal-header h2 {
            color: white;
            font-size: 20px;
        }

        .close-btn {
            background: none;
            border: none;
            color: #8b8b8b;
            font-size: 28px;
            cursor: pointer;
            padding: 0;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: all 0.2s;
        }

        .close-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }

        .modal-body {
            padding: 24px;
        }

        .current-info {
            color: #8b8b8b;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .current-info strong {
            color: white;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-group label {
            color: #8b8b8b;
            font-size: 14px;
        }

        .input-group input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid #3d3d5c;
            border-radius: 8px;
            font-size: 16px;
            color: white;
            box-sizing: border-box;
            transition: all 0.2s;
        }

        .input-group input:focus {
            outline: none;
            border-color: #00ff88;
            background: rgba(255, 255, 255, 0.15);
        }

        .modal-footer {
            display: flex;
            gap: 12px;
            padding: 20px 24px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn {
            flex: 1;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-secondary {
            background: #4a4a6a;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a5a7a;
        }

        .btn-primary {
            background: linear-gradient(135deg, #00ff88, #00cc6a);
            color: #1a1a2e;
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(0, 255, 136, 0.3);
        }

        .btn-danger {
            background: linear-gradient(135deg, #ff6b6b, #cc4757);
            color: white;
        }

        .hidden {
            display: none !important;
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(26, 26, 46, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(0, 255, 136, 0.2);
            border-top-color: #00ff88;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            color: #8b8b8b;
            font-size: 16px;
        }

        @media (max-width: 768px) {
            body { padding: 10px; }
            
            .header {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }
            
            .header h1 { font-size: 22px; }
            
            .main-layout {
                flex-direction: column;
                align-items: center;
                gap: 20px;
            }
            
            .side-column {
                flex-direction: row;
                gap: 10px;
            }
            
            .side-column.left {
                border-right: none;
                border-bottom: 2px dashed rgba(255, 255, 255, 0.1);
                padding-right: 10px;
                padding-bottom: 20px;
            }
            
            .side-column.right {
                border-left: none;
                border-top: 2px dashed rgba(255, 255, 255, 0.1);
                padding-left: 10px;
                padding-top: 20px;
            }
            
            .seat { width: 40px; height: 40px; font-size: 12px; }
            .seat-name { font-size: 10px; }
            
            .bottom-section {
                flex-wrap: wrap;
                gap: 15px;
            }
            
            .legend {
                flex-wrap: wrap;
                gap: 15px;
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
        <div class="loading-text" id="loadingText">正在连接服务器...</div>
    </div>

    <div class="container">
        <div class="header">
            <h1>座位选座系统</h1>
            <div class="header-right">
                <div class="connection-status">
                    <div class="status-dot offline" id="statusDot"></div>
                    <span id="statusText">连接中...</span>
                </div>
                <div class="online-count" id="onlineCount"></div>
                <button class="admin-toggle" id="adminToggle" onclick="toggleAdmin()">
                    用户模式
                </button>
            </div>
        </div>

        <div class="date-tabs" id="dateTabs"></div>

        <div class="seat-map">
            <div class="exit exit-left">出入口</div>
            <div class="exit exit-right">出入口</div>
            
            <div class="dj-stage">DJ STAGE</div>
            
            <div class="main-layout">
                <div class="side-column left" id="leftSeats"></div>
                
                <div class="center-area" id="centerSeats"></div>
                
                <div class="side-column right" id="rightSeats"></div>
            </div>

            <div class="bottom-section">
                <div class="bar-section">吧台</div>
                <div class="front-seats" id="frontSeats"></div>
                <div class="front-label">前台</div>
            </div>
        </div>

        <div class="legend">
            <div class="legend-item">
                <div class="legend-color available"></div>
                <span>可选择</span>
            </div>
            <div class="legend-item">
                <div class="legend-color locked"></div>
                <span>正在选座</span>
            </div>
            <div class="legend-item">
                <div class="legend-color selected"></div>
                <span>已占用</span>
            </div>
        </div>
    </div>

    <div class="modal-overlay hidden" id="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">座位</h2>
                <button class="close-btn" onclick="closeModal()">×</button>
            </div>
            <div class="modal-body">
                <div class="current-info">
                    <span>当前姓名：</span>
                    <strong id="currentName">未填写</strong>
                </div>
                <div class="input-group">
                    <label>输入姓名：</label>
                    <input type="text" id="nameInput" placeholder="请输入姓名" maxlength="20">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal()">取消</button>
                <button class="btn btn-danger hidden" id="releaseBtn" onclick="releaseSeat()">释放座位</button>
                <button class="btn btn-primary" id="confirmBtn" onclick="confirmSeat()">确认</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script>
        const BACKEND_URL = 'https://a98-sites-264999-8-1439101030.sh.run.tcloudbase.com';
        
        const SEAT_CONFIG = {
            left: ['F01', 'F02', 'F03', 'F04'],
            right: ['F06', 'F08', 'F05', 'F10'],
            front: ['F13', 'F12', 'F11'],
            rows: [
                ['A01', 'A02', 'A03', 'A05', 'A06'],
                ['A08', 'A09', 'A10', 'A11', 'A12'],
                ['A13', 'A15', 'A16', 'A18'],
                ['A19', 'A20', 'A21'],
                ['A22', 'A23', 'A25'],
                ['A26', 'A28', 'A29', 'A30'],
                ['A31', 'A32', 'A33', 'A35'],
                ['A36', 'A38', 'A39', 'A50']
            ]
        };

        const DEFAULT_SEATS = [
            { id: 'A01', name: '', selected: false, isLocked: false },
            { id: 'A02', name: '', selected: false, isLocked: false },
            { id: 'A03', name: '', selected: false, isLocked: false },
            { id: 'A05', name: '', selected: false, isLocked: false },
            { id: 'A06', name: '', selected: false, isLocked: false },
            { id: 'A08', name: '', selected: false, isLocked: false },
            { id: 'A09', name: '', selected: false, isLocked: false },
            { id: 'A10', name: '', selected: false, isLocked: false },
            { id: 'A11', name: '', selected: false, isLocked: false },
            { id: 'A12', name: '', selected: false, isLocked: false },
            { id: 'A13', name: '', selected: false, isLocked: false },
            { id: 'A15', name: '', selected: false, isLocked: false },
            { id: 'A16', name: '', selected: false, isLocked: false },
            { id: 'A18', name: '', selected: false, isLocked: false },
            { id: 'A19', name: '', selected: false, isLocked: false },
            { id: 'A20', name: '', selected: false, isLocked: false },
            { id: 'A21', name: '', selected: false, isLocked: false },
            { id: 'A22', name: '', selected: false, isLocked: false },
            { id: 'A23', name: '', selected: false, isLocked: false },
            { id: 'A25', name: '', selected: false, isLocked: false },
            { id: 'A26', name: '', selected: false, isLocked: false },
            { id: 'A28', name: '', selected: false, isLocked: false },
            { id: 'A29', name: '', selected: false, isLocked: false },
            { id: 'A30', name: '', selected: false, isLocked: false },
            { id: 'A31', name: '', selected: false, isLocked: false },
            { id: 'A32', name: '', selected: false, isLocked: false },
            { id: 'A33', name: '', selected: false, isLocked: false },
            { id: 'A35', name: '', selected: false, isLocked: false },
            { id: 'A36', name: '', selected: false, isLocked: false },
            { id: 'A38', name: '', selected: false, isLocked: false },
            { id: 'A39', name: '', selected: false, isLocked: false },
            { id: 'A50', name: '', selected: false, isLocked: false },
            { id: 'F01', name: '', selected: false, isLocked: false },
            { id: 'F02', name: '', selected: false, isLocked: false },
            { id: 'F03', name: '', selected: false, isLocked: false },
            { id: 'F04', name: '', selected: false, isLocked: false },
            { id: 'F05', name: '', selected: false, isLocked: false },
            { id: 'F06', name: '', selected: false, isLocked: false },
            { id: 'F08', name: '', selected: false, isLocked: false },
            { id: 'F10', name: '', selected: false, isLocked: false },
            { id: 'F11', name: '', selected: false, isLocked: false },
            { id: 'F12', name: '', selected: false, isLocked: false },
            { id: 'F13', name: '', selected: false, isLocked: false }
        ];

        function arrayToObject(seatArray) {
            const obj = {};
            seatArray.forEach(seat => {
                obj[seat.id] = { ...seat };
            });
            return obj;
        }

        function getDefaultSeatsObject() {
            return arrayToObject(DEFAULT_SEATS);
        }

        let socket;
        let userId;
        let currentDate;
        let seats = {};
        let isAdmin = false;
        let currentSeatId = null;
        let isLockedByUser = false;

        function updateLoading(show, text = '加载中...') {
            const overlay = document.getElementById('loadingOverlay');
            const loadingText = document.getElementById('loadingText');
            if (show) {
                overlay.classList.remove('hidden');
                loadingText.textContent = text;
            } else {
                overlay.classList.add('hidden');
            }
        }

        function updateConnectionStatus(connected) {
            const dot = document.getElementById('statusDot');
            const text = document.getElementById('statusText');
            if (connected) {
                dot.className = 'status-dot online';
                text.textContent = '已连接';
            } else {
                dot.className = 'status-dot offline';
                text.textContent = '连接中...';
            }
        }

        function generateDates() {
            const container = document.getElementById('dateTabs');
            const dates = [];
            
            for (let i = 0; i < 3; i++) {
                const date = new Date();
                date.setDate(date.getDate() + i);
                const year = date.getFullYear();
                const month = String(date.getMonth() + 1).padStart(2, '0');
                const day = String(date.getDate()).padStart(2, '0');
                const value = `${year}-${month}-${day}`;
                const weekdays = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
                const label = i === 0 ? '今天' : (i === 1 ? '明天' : `${month}月${day}日 ${weekdays[date.getDay()]}`);
                dates.push({ value, label });
            }

            container.innerHTML = dates.map(d => `
                <div class="date-tab ${d.value === currentDate ? 'active' : ''}" 
                     onclick="switchDate('${d.value}')">${d.label}</div>
            `).join('');

            if (!currentDate) {
                currentDate = dates[0].value;
            }
        }

        function switchDate(date) {
            if (isLockedByUser && currentSeatId) {
                unlockSeat(currentSeatId);
            }
            closeModal();
            currentDate = date;
            generateDates();
            socket.emit('getSeats', currentDate);
        }

        function renderSeats() {
            ensureAllSeatsExist();
            document.getElementById('leftSeats').innerHTML = SEAT_CONFIG.left.map(id => createSeatHTML(id)).join('');
            document.getElementById('rightSeats').innerHTML = SEAT_CONFIG.right.map(id => createSeatHTML(id)).join('');
            document.getElementById('frontSeats').innerHTML = SEAT_CONFIG.front.map(id => createSeatHTML(id)).join('');
            document.getElementById('centerSeats').innerHTML = SEAT_CONFIG.rows.map((row, i) => {
                let html = '<div class="seat-row">';
                if (i === 3) {
                    html += '<div class="satg">SATG</div>';
                }
                row.forEach(id => {
                    html += createSeatHTML(id);
                });
                if (i === 3) {
                    html += '<div class="satg">SATG</div>';
                }
                html += '</div>';
                return html;
            }).join('');
        }

        function createSeatHTML(id) {
            const seat = seats[id] || { name: '', selected: false, isLocked: false };
            let seatClass = 'seat';
            if (seat.selected && seat.name) {
                seatClass += ' selected';
            } else if (seat.isLocked) {
                seatClass += ' locked';
            } else {
                seatClass += ' available';
            }
            
            return `
                <div class="seat-item" onclick="onSeatClick('${id}')">
                    <div class="${seatClass}">${id}</div>
                    ${seat.name ? `<div class="seat-name">${seat.name.length > 4 ? seat.name.substring(0, 4) + '...' : seat.name}</div>` : ''}
                </div>
            `;
        }

        function ensureAllSeatsExist() {
            const defaultSeats = getDefaultSeatsObject();
            for (const id in defaultSeats) {
                if (!seats[id]) {
                    seats[id] = { ...defaultSeats[id] };
                }
            }
        }

        function onSeatClick(id) {
            const seat = seats[id];
            if (!seat) return;
            
            if (seat.selected && seat.name) {
                if (isAdmin) {
                    openModal(id);
                } else {
                    alert('此座位已被占用');
                }
                return;
            }

            if (seat.isLocked) {
                if (seat.lockUserId === userId) {
                    openModal(id);
                } else {
                    alert('座位正在被其他人选择');
                }
                return;
            }

            socket.emit('lockSeat', { date: currentDate, seatId: id, userId: userId });
        }

        function unlockSeat(seatId) {
            socket.emit('unlockSeat', { date: currentDate, seatId: seatId, userId: userId });
        }

        function openModal(id) {
            currentSeatId = id;
            const seat = seats[id] || { name: '' };
            
            document.getElementById('modalTitle').textContent = '座位 ' + id;
            document.getElementById('currentName').textContent = seat.name || '未填写';
            document.getElementById('nameInput').value = seat.name || '';
            
            const confirmBtn = document.getElementById('confirmBtn');
            const releaseBtn = document.getElementById('releaseBtn');
            
            if (isAdmin && seat.name) {
                releaseBtn.classList.remove('hidden');
                confirmBtn.textContent = '修改';
            } else {
                releaseBtn.classList.add('hidden');
                confirmBtn.textContent = seat.name ? '仅管理员可修改' : '确认';
            }
            
            if (isAdmin || !seat.name) {
                confirmBtn.disabled = false;
            } else {
                confirmBtn.disabled = true;
            }
            
            document.getElementById('modal').classList.remove('hidden');
            document.getElementById('nameInput').focus();
        }

        async function closeModal() {
            if (isLockedByUser && currentSeatId) {
                await unlockSeat(currentSeatId);
            }
            document.getElementById('modal').classList.add('hidden');
            currentSeatId = null;
            isLockedByUser = false;
        }

        function confirmSeat() {
            const name = document.getElementById('nameInput').value.trim();
            
            if (!isAdmin && !name) {
                alert('请输入姓名');
                return;
            }

            if (currentSeatId) {
                socket.emit('confirmSeat', { 
                    date: currentDate, 
                    seatId: currentSeatId, 
                    userId: userId, 
                    name: name 
                });
                closeModal();
            }
        }

        function releaseSeat() {
            if (currentSeatId) {
                socket.emit('releaseSeat', { 
                    date: currentDate, 
                    seatId: currentSeatId 
                });
                closeModal();
            }
        }

        function toggleAdmin() {
            if (isAdmin) {
                isAdmin = false;
                const btn = document.getElementById('adminToggle');
                btn.textContent = '用户模式';
                btn.classList.remove('active');
            } else {
                const pwd = prompt('请输入管理员密码：');
                if (pwd === '19111911') {
                    isAdmin = true;
                    const btn = document.getElementById('adminToggle');
                    btn.textContent = '管理员模式';
                    btn.classList.add('active');
                    alert('已进入管理员模式');
                } else {
                    alert('密码错误');
                }
            }
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeModal();
            }
            if (e.key === 'Enter' && !document.getElementById('modal').classList.contains('hidden')) {
                confirmSeat();
            }
        });

        function init() {
            userId = 'user_' + Math.random().toString(36).substr(2, 9);
            
            // 先使用默认座位初始化并立即渲染
            seats = getDefaultSeatsObject();
            generateDates();
            renderSeats();
            updateLoading(false);
            
            socket = io(BACKEND_URL);

            socket.on('connect', () => {
                console.log('已连接到服务器');
                updateConnectionStatus(true);
                socket.emit('getSeats', currentDate);
            });

            socket.on('disconnect', () => {
                console.log('与服务器断开连接');
                updateConnectionStatus(false);
            });

            socket.on('onlineCount', (count) => {
                document.getElementById('onlineCount').textContent = `在线人数: ${count}`;
            });

            socket.on('seatsData', (data) => {
                if (data && data.seats) {
                    // 如果是数组格式，转换为对象
                    if (Array.isArray(data.seats)) {
                        seats = arrayToObject(data.seats);
                    } else {
                        seats = data.seats;
                    }
                } else {
                    // 没有数据时使用默认座位
                    seats = getDefaultSeatsObject();
                }
                renderSeats();
            });

            socket.on('seatsUpdated', ({ date, data }) => {
                if (date === currentDate) {
                    if (data && data.seats) {
                        if (Array.isArray(data.seats)) {
                            seats = arrayToObject(data.seats);
                        } else {
                            seats = data.seats;
                        }
                    } else {
                        seats = getDefaultSeatsObject();
                    }
                    renderSeats();
                }
            });

            socket.on('seatLocked', ({ seatId }) => {
                isLockedByUser = true;
                openModal(seatId);
            });

            socket.on('error', ({ message }) => {
                alert(message);
            });

            updateLoading(true, '正在连接服务器...');
        }

        window.addEventListener('load', init);
    </script>
</body>
</html>
